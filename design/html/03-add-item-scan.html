<body class="bg-background text-on-background min-h-screen pb-xl antialiased">

</header>

</div>

<span class="material-symbols-outlined text-primary text-[18px]">check_circle</span>
<span class="text-label-md font-label-md text-primary">Item Recognized</span>
</div>
</div>

<input class="w-full bg-surface-container-lowest border border-outline/20 rounded-lg px-4 py-3 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 input-glow transition-all" id="itemName" type="text" value="Organic Whole Milk">
</div>

<div class="flex flex-col gap-xs">

<option value="produce">Produce</option>
<option value="pantry">Pantry</option>
<option value="meat">Meat</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>

<option value="top_shelf">Top Shelf</option>
<option value="crisper">Crisper Drawer</option>
<option value="pantry">Pantry Shelves</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<div class="h-px w-full bg-primary/10 my-4"></div>

<input class="w-full bg-surface-container-lowest border border-outline/20 rounded-lg px-4 py-3 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-0 input-glow transition-all" id="buyDate" type="date" value="2023-10-10">
</div>
</div>
