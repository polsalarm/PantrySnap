<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="meatballGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="noodleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0369A1" flood-opacity="0.35"/>
    </filter>
    <filter id="meatballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#450A0A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)"/>

  <!-- Puffy Cartoon Background Clouds -->
  <g fill="#E0F2FE" opacity="0.6">
    <circle cx="110" cy="180" r="50"/>
    <circle cx="160" cy="150" r="60"/>
    <circle cx="220" cy="180" r="55"/>
  </g>
  <g fill="#E0F2FE" opacity="0.6">
    <circle cx="390" cy="190" r="55"/>
    <circle cx="340" cy="160" r="60"/>
    <circle cx="440" cy="195" r="45"/>
  </g>

  <!-- Giant Fluffy Top Cloud -->
  <g filter="url(#dropShadow)">
    <!-- Cloud base path -->
    <path d="M 120 150 
             A 55 55 0 0 1 200 100 
             A 75 75 0 0 1 320 95 
             A 60 60 0 0 1 400 145 
             A 45 45 0 0 1 390 200 
             L 125 200 
             A 45 45 0 0 1 120 150 Z" 
          fill="#FFFFFF" />
    <!-- Cloud shading -->
    <path d="M 125 185 Q 256 215 390 185 A 45 45 0 0 1 390 200 L 125 200 A 45 45 0 0 1 125 185 Z" fill="#BAE6FD" opacity="0.7"/>
  </g>

  <!-- Spaghetti swirl stream falling from cloud -->
  <path d="M 180 180 Q 150 280 230 330 Q 330 390 310 440" 
        fill="none" stroke="url(#noodleGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 330 180 Q 360 260 290 320 Q 200 370 210 430" 
        fill="none" stroke="url(#noodleGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Giant Falling Meatball -->
  <g filter="url(#meatballShadow)">
    <!-- Main sphere -->
    <circle cx="256" cy="275" r="105" fill="url(#meatballGrad)" stroke="#FFFFFF" stroke-width="6"/>
    
    <!-- Meatball texture lumps and seasoning -->
    <circle cx="210" cy="235" r="16" fill="#991B1B" opacity="0.8"/>
    <circle cx="285" cy="230" r="14" fill="#991B1B" opacity="0.8"/>
    <circle cx="315" cy="280" r="18" fill="#7F1D1D" opacity="0.9"/>
    <circle cx="245" cy="320" r="22" fill="#7F1D1D" opacity="0.9"/>
    <circle cx="195" cy="295" r="15" fill="#7F1D1D" opacity="0.85"/>
    <circle cx="260" cy="265" r="12" fill="#B91C1C" opacity="0.9"/>

    <!-- Herb seasoning flecks (parsley / oregano) -->
    <ellipse cx="235" cy="250" rx="4" ry="7" transform="rotate(25 235 250)" fill="#22C55E"/>
    <ellipse cx="275" cy="290" rx="3" ry="6" transform="rotate(-35 275 290)" fill="#16A34A"/>
    <ellipse cx="225" cy="305" rx="4" ry="6" transform="rotate(45 225 305)" fill="#22C55E"/>
    <ellipse cx="295" cy="255" rx="3" ry="5" transform="rotate(15 295 255)" fill="#4ADE80"/>

    <!-- Meatball glossy highlight -->
    <ellipse cx="215" cy="215" rx="28" ry="14" transform="rotate(-30 215 215)" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Dripping Cheddar / Cheese Sauce Accent -->
  <path d="M 215 200 Q 240 215 256 195 Q 275 215 295 202 Q 300 230 280 240 Q 256 220 230 235 Z" 
        fill="#FBBF24" stroke="#D97706" stroke-width="3"/>

  <!-- Fresh Green Basil Leaf on Top -->
  <g transform="translate(256, 175) rotate(-15)">
    <path d="M 0 0 C -25 -20 -30 -50 0 -60 C 30 -50 25 -20 0 0 Z" fill="#22C55E" stroke="#15803D" stroke-width="4"/>
    <path d="M 0 0 L 0 -52" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Camera / Sparkle Flash -->
  <g transform="translate(380, 110)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#FEF08A"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
  <g transform="translate(130, 290) scale(0.6)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#FEF08A"/>
  </g>
</svg>
