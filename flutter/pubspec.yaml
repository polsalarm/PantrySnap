name: pantrysnap
description: Visual pantry and fridge organizer for Android and iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/steve.png
    - assets/icon-192.png
